name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Validate focused accumulated-slop corpus
        run: python3 scripts/validate_focused_corpus.py
      - name: Validate evidence-edge draft corpus
        run: python3 scripts/validate_evidence_edges_corpus.py
      - name: Validate persistence counterexamples and coverage revision
        run: |
          python3 scripts/validate_persistence_corpus.py
          python3 scripts/validate_grader_revision.py
          python3 evals/dev-v4-transfer/held_back/validate_transfer.py
          python3 evals/grader-revisions/transfer-existing-v0-v1/probe.py --calibrate
          python3 evals/grader-revisions/persistence-legacy-integrity-v1/probe.py --calibrate
      - name: Validate harness wrapper
        run: |
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py self-test \
            --skill skills/deslop \
            --evals evals/dev-v2-focused/evals.json
      - name: Validate eval manifests
        run: |
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py validate evals/dev-v2-focused/evals.json
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py validate evals/dev-v2-focused/mini-evals.json
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py validate evals/dev-v3-evidence-edges/evals.json
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py validate evals/runtime-controls/evals.json
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py validate evals/dev-v4-persistence/evals.json
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py validate evals/dev-v4-transfer/evals.json
