name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Validate skill and fixtures
        run: python3 scripts/validate_corpus.py
      - name: Validate harness wrapper
        run: |
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py self-test \
            --skill . \
            --evals evals/evals.json
      - name: Validate agent-skill-eval manifest
        run: |
          uv run --with agent-skill-eval==0.7.0 \
            python scripts/run_agent_skill_eval.py validate evals/evals.json
